# A1 Unit 3 — Род и множествено число / Gender and plural. All ai_draft; doubts in content/REVIEW_QUEUE.md.
# Plural forms whose stress I'm unsure of are left without a stress mark (see REVIEW_QUEUE.md).
# град, телефон, чанта, море and кафе live in section-0-words.yaml (their plurals were added there).

unit:
  id: 'unit.a1-03'
  order: 3
  title:
    en: Gender and plural
    tr: Cinsiyet ve çoğul
  cefr: A1
  goals:
    - en: "Tell a noun's gender from its ending"
      tr: İsmin cinsiyetini sonundan anlamak
    - en: 'Use един, една, едно and ask "Какво е това?"'
      tr: 'един, една, едно kullanmak ve "Какво е това?" diye sormak'
    - en: Make regular plurals
      tr: Düzenli çoğul yapmak
  grammarIds:
    - 'gram.noun.gender-by-ending'
    - gram.number.one
    - gram.noun.plural
  lessonIds:
    - 'lesson.a1-03-01'
    - 'lesson.a1-03-02'
    - 'lesson.a1-03-03'
    - 'lesson.a1-03-04'
    - 'lesson.a1-03-05'
