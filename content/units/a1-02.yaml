# A1 Unit 2 — Аз съм… / I am… All ai_draft; doubts are in content/REVIEW_QUEUE.md.

unit:
  id: 'unit.a1-02'
  order: 2
  title:
    en: I am…
    tr: Ben…
  cefr: A1
  goals:
    - en: "Say who you are and where you're from"
      tr: Kim olduğunu ve nereli olduğunu söylemek
    - en: Use every form of съм (to be)
      tr: съм (olmak) fiilinin bütün biçimlerini kullanmak
    - en: Drop the pronoun like a Bulgarian
      tr: Bir Bulgar gibi zamiri söylemeden konuşmak
  grammarIds:
    - gram.pronouns.personal
    - gram.sam.present
    - 'gram.pronouns.he-she-it'
    - 'gram.pro-drop'
    - 'gram.clitic.sam-position'
  lessonIds:
    - 'lesson.a1-02-01'
    - 'lesson.a1-02-02'
    - 'lesson.a1-02-03'
    - 'lesson.a1-02-04'
    - 'lesson.a1-02-05'
