# A1 Unit 1 — Поздрави / Greetings. All ai_draft; doubts are in content/REVIEW_QUEUE.md.

unit:
  id: 'unit.a1-01'
  order: 1
  title:
    en: Greetings
    tr: Selamlaşma
  cefr: A1
  goals:
    - en: Greet people at any time of day
      tr: Günün her saatinde selamlaşmak
    - en: 'Say thank you, please and sorry'
      tr: 'Teşekkür etmek, rica etmek, özür dilemek'
    - en: 'Ask "How are you?" and answer'
      tr: '"Nasılsın?" diye sormak ve cevap vermek'
  grammarIds:
    - 'gram.greetings.formal-informal'
    - 'gram.culture.head-gestures'
  lessonIds:
    - 'lesson.a1-01-01'
    - 'lesson.a1-01-02'
    - 'lesson.a1-01-03'
    - 'lesson.a1-01-04'
